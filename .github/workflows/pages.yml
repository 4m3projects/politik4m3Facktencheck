# Erzeugt die statische Webseite aus den Faktencheck-Daten und veröffentlicht sie über GitHub Pages.
# Pull Requests: nur Prüfung und Testaufbau, keine Veröffentlichung.
# Push auf main: Prüfung, Aufbau und Veröffentlichung.
# Was veröffentlicht wird, legt allein scripts/build-site.js fest (Seitendateien aus site/ ohne Tests, eigene Markdown-
# Berichte, strukturierte JSON-Dateien, video.json und rhetorik.json je Video, beziehungen.json, Übersichtsdaten,
# Wissensverzeichnis, Verlauf und Einstiegsseiten für geteilte Links; siehe docs/WEBSEITE.md). Die Browsertests bauen
# die Seite mit demselben Skript.
name: Webseite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publikationsprüfung
        shell: pwsh
        run: ./scripts/Test-Publication.ps1

      - name: Faktencheck-Regressionstests (PowerShell 7)
        shell: pwsh
        run: ./scripts/Test-Factcheck.ps1

      - name: Generator-Prüfmodus je Video
        shell: pwsh
        run: |
          foreach ($dir in Get-ChildItem -Directory faktenchecks) {
            if (Test-Path (Join-Path $dir.FullName 'strukturiert/aussagen.json')) {
              Write-Host "Build-Factcheck -Check: $($dir.Name)"
              ./scripts/Build-Factcheck.ps1 -VideoId $dir.Name -Check
            }
          }

      - name: Berichts- und Tastatursprünge prüfen
        run: node --test site/report-anchor-test.js site/skip-link-test.js

      - name: Synchronisationslogik testen
        run: node --test site/sync-test.js

      - name: Originale, Reaktionen und Beziehungen prüfen
        run: node --test site/relations-test.js

      - name: Rhetorik-Ebene prüfen (getrennt von der Faktenbewertung)
        run: node --test site/rhetoric-test.js

      - name: Faktenindex und Ampel prüfen (gemeinsame Regel aller Faktencheckseiten, nur aus Aussagebewertungen)
        run: |
          node --test site/faktenindex-test.js
          node scripts/faktenindex.js pruefen

      - name: Gegendarstellungen prüfen (nur belegte Gegenaussagen zu kritischen Aussagen)
        run: node --test site/gegendarstellung-test.js

      - name: Verlauf prüfen (aus der Git-Historie berechnet)
        run: node --test site/verlauf-test.js

      - name: Rangliste prüfen (nur aus dem Faktenindex berechnet)
        run: node --test site/rangliste-test.js

      - name: Themen-Wissensdatenbank prüfen (Daten, Korrekturregeln, Schutz vor Überschreiben)
        run: |
          node --test site/wissen-test.js
          node scripts/wissen.js pruefen
          node scripts/wissen.js korrekturen --bericht "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            node scripts/wissen.js aenderung --basis FETCH_HEAD
          fi

      - name: Seitenaufbau prüfen (Dateien, Versionsparameter, Übersichtsdaten, ausgeblendete Videos)
        run: node --test site/build-site-test.js

      - name: Webseite zusammenstellen
        env:
          OUT: ${{ runner.temp }}/site
        run: |
          set -euo pipefail
          node scripts/build-site.js "$OUT"
          find "$OUT" -type f | sort

      - name: Playwright für die Browsertests bereitstellen (nur im Runner, nichts im Repository)
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Browsertests (Startseite, Videoseite, Video-Ansicht, Reaktionen, Rhetorik, Themen)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          set -euo pipefail
          for t in portal-browser-test browser-test relations-browser-test rhetoric-browser-test wissen-browser-test; do
            echo "::group::$t"
            node "site/$t.js"
            echo "::endgroup::"
          done

      - name: Seitenartefakt hochladen
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
